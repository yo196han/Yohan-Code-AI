[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yohan-code"
version = "1.0.0"
description = "YOHAN CODE - AI Coding Assistant CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
yohan = "yohan.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["yohan*"]

[tool.setuptools.package-data]
yohan = ["skills/**/*"]
